apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
  labels:
    app.kubernetes.io/part-of: crud-demo
data:
  init.sql: |
    CREATE ROLE web_anon NOLOGIN;
    CREATE SCHEMA api AUTHORIZATION crud_admin;

    CREATE TABLE api.todos (
      id BIGSERIAL PRIMARY KEY,
      title TEXT NOT NULL CHECK (length(trim(title)) > 0),
      completed BOOLEAN NOT NULL DEFAULT FALSE,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    GRANT USAGE ON SCHEMA api TO web_anon;
    GRANT SELECT, INSERT, UPDATE, DELETE ON api.todos TO web_anon;
    GRANT USAGE, SELECT ON SEQUENCE api.todos_id_seq TO web_anon;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: crud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database
        app.kubernetes.io/part-of: crud-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: crud
            - name: POSTGRES_USER
              value: crud_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: database-init
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: crud-demo
spec:
  selector:
    app.kubernetes.io/name: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: crud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: crud-demo
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v14.16
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-db
                  key: password
            - name: PGRST_DB_URI
              value: postgres://crud_admin:$(DB_PASSWORD)@database:5432/crud
            - name: PGRST_DB_SCHEMAS
              value: api
            - name: PGRST_DB_ANON_ROLE
              value: web_anon
            - name: PGRST_SERVER_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: crud-demo
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-content
  labels:
    app.kubernetes.io/part-of: crud-demo
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri /index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CRUD Todo Stack</title>
        <style>
          :root { color-scheme: light; font-family: system-ui, sans-serif; }
          body { background: #f4f6f8; color: #17202a; margin: 0; }
          main { margin: 4rem auto; max-width: 42rem; padding: 0 1rem; }
          section { background: white; border-radius: 0.75rem; box-shadow: 0 0.25rem 1.5rem #0001; padding: 1.5rem; }
          h1 { margin-top: 0; }
          form { display: flex; gap: 0.5rem; }
          input[type="text"] { border: 1px solid #bbc3cc; border-radius: 0.4rem; flex: 1; padding: 0.7rem; }
          button { background: #1769aa; border: 0; border-radius: 0.4rem; color: white; cursor: pointer; padding: 0.7rem 1rem; }
          button.secondary { background: #5f6b76; }
          button.danger { background: #b42318; }
          ul { list-style: none; padding: 0; }
          li { align-items: center; border-top: 1px solid #e5e9ed; display: flex; gap: 0.75rem; padding: 0.8rem 0; }
          li span { flex: 1; }
          li.completed span { color: #6b7580; text-decoration: line-through; }
          #status { color: #b42318; min-height: 1.5rem; }
        </style>
      </head>
      <body>
        <main>
          <section>
            <h1>Todo CRUD demo</h1>
            <form id="create-form">
              <input id="new-title" type="text" maxlength="200" placeholder="Add a todo" required>
              <button type="submit">Add</button>
            </form>
            <p id="status" role="alert"></p>
            <ul id="todos"></ul>
          </section>
        </main>
        <script>
          const api = '/api/todos';
          const list = document.querySelector('#todos');
          const status = document.querySelector('#status');

          async function request(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            const body = await response.text();
            return body ? JSON.parse(body) : null;
          }

          async function loadTodos() {
            try {
              status.textContent = '';
              const todos = await request(`${api}?select=id,title,completed,created_at&order=id.asc`);
              list.replaceChildren(...todos.map(renderTodo));
            } catch (error) {
              status.textContent = `Unable to load todos: ${error.message}`;
            }
          }

          function renderTodo(todo) {
            const item = document.createElement('li');
            item.className = todo.completed ? 'completed' : '';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.completed;
            checkbox.title = 'Mark complete';
            checkbox.addEventListener('change', () => updateTodo(todo.id, { completed: checkbox.checked }));

            const title = document.createElement('span');
            title.textContent = todo.title;

            const edit = document.createElement('button');
            edit.type = 'button';
            edit.className = 'secondary';
            edit.textContent = 'Edit';
            edit.addEventListener('click', () => {
              const nextTitle = window.prompt('Todo title', todo.title);
              if (nextTitle !== null && nextTitle.trim()) updateTodo(todo.id, { title: nextTitle.trim() });
            });

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = 'Delete';
            remove.addEventListener('click', () => deleteTodo(todo.id));

            item.append(checkbox, title, edit, remove);
            return item;
          }

          async function updateTodo(id, changes) {
            try {
              await request(`${api}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                body: JSON.stringify(changes)
              });
              await loadTodos();
            } catch (error) {
              status.textContent = `Unable to update todo: ${error.message}`;
            }
          }

          async function deleteTodo(id) {
            try {
              await request(`${api}?id=eq.${id}`, { method: 'DELETE' });
              await loadTodos();
            } catch (error) {
              status.textContent = `Unable to delete todo: ${error.message}`;
            }
          }

          document.querySelector('#create-form').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.querySelector('#new-title');
            try {
              await request(api, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                body: JSON.stringify({ title: input.value.trim() })
              });
              input.value = '';
              await loadTodos();
            } catch (error) {
              status.textContent = `Unable to create todo: ${error.message}`;
            }
          });

          loadTodos();
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: crud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/part-of: crud-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: ui-content
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: crud-demo
spec:
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: crud-demo
  annotations:
    alb.ingress.kubernetes.io/group.name: shared-ui
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: __STACK_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
